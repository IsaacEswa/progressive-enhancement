<!doctype html>
<html lang="nl">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Switch control / Progressive Enhancement / FDND</title>
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
		rel="stylesheet">
	<link href="assets/styles.css" rel="stylesheet">
	<style>
		/* Schrijf hier gewoon je CSS voor dit component */
		.switch-control {
			/* styling uitzetten */
			appearance: none;

			width: 80px;
			height: 40px;
			background: grey;
			border-radius: 20px;
			position: relative;
			cursor: pointer;
		}

		.switch-control::before {
			content: "";
			position: absolute;
			width: 32px;
			height: 32px;
			background: white;
			border-radius: 50%;
			top: 4px;
			left: 4px;
			transition: .3s;
		}

		.switch-control:checked {
			background: var(--green);
		}

		.switch-control:checked::before {
			transform: translateX(40px);
			content: "aan";
			font-weight: bold;

		}

		/* Hint: Dit component kun je volledig met HTML en CSS bouwen */

		/* Hint: Hoe ver ga je qua styling? Vraag jezelf dit altijd af */
	</style>
</head>

<body>
	<h1>Switch control</h1>

	<!-- Hint: Safari heeft hiervoor iets bedacht, maar is dat al een standaard?
		     Wat gebeurt er in browsers die dat nog niet ondersteunen? -->

	<form>
		<label class="switch">
			<input type="checkbox" class="switch-control">
		</label>
	</form>

	<details open>
		<summary>Demo video</summary>
		<video src="assets/switch.mp4" width="119" height="67" controls muted autoplay loop>
			<a href="assets/switch.mp4">assets/switch.mp4</a>
		</video>
	</details>
</body>

</html>
